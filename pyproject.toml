[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uf"
version = "0.1.3"
description = "Minimal-boilerplate web UIs for Python functions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "ui",
    "forms",
    "rjsf",
    "json-schema",
    "web-ui",
    "fastapi",
    "bottle",
    "python-functions",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Framework :: FastAPI",
]
dependencies = ["qh", "ju", "i2", "dol", "meshed"]

[project.urls]
Homepage = "https://github.com/i2mint/uf"
Repository = "https://github.com/i2mint/uf"
Documentation = "https://i2mint.github.io/uf/"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
